name = "snapog"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "snapog-db"
database_id = "placeholder-set-after-wrangler-d1-create"

[[r2_buckets]]
binding = "OG_CACHE"
bucket_name = "snapog-og-cache"

[vars]
ENVIRONMENT = "development"
# Stripe — set via `wrangler secret put` in production:
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put STRIPE_PRO_PRICE_ID
#   wrangler secret put STRIPE_BUSINESS_PRICE_ID
# AUTH_SECRET — set via `wrangler secret put AUTH_SECRET` for dashboard cookie signing

[env.staging]
name = "snapog-staging"
[env.staging.vars]
ENVIRONMENT = "staging"

[env.production]
name = "snapog"
[env.production.vars]
ENVIRONMENT = "production"
