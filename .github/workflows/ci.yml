name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Verify project structure
        run: |
          test -f src/index.ts
          test -f src/og/render.ts
          test -f src/og/templates.ts
          test -f wrangler.toml
          test -f package.json
          echo "✓ Project structure verified"
