# fly.toml — SnapOG deployment on Fly.io
# Generated for Cycle #8 Cloudflare → Fly.io migration

app = "snapog"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# ── Persistent SQLite database ────────────────────────────────────────────
[[mounts]]
  source = "snapog_data"
  destination = "/data"

# ── HTTP service ──────────────────────────────────────────────────────────
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# ── VM sizing ─────────────────────────────────────────────────────────────
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# ── Environment (non-secret values only; use `fly secrets set` for keys) ──
[env]
  PORT = "3000"
  DB_PATH = "/data/snapog.db"
  NODE_ENV = "production"
